<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Manage Nutrition</title>
        <style>
            *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
            body{background:#f4f6f9;display:flex;justify-content:center;align-items:center;height:100vh;}
            form{background:#fff;padding:30px;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,.2);}
            table{width:500px;border-collapse:collapse;}
            td{padding:12px;}
            td:first-child{font-weight:bold;width:150px;}
            input,textarea
            {
                width:100%;
                padding:10px;
                border:1px solid #ccc;
                border-radius:5px;
            }
            textarea{height:100px;resize:none;}
            input[type=submit]
            {
                background:#28a745;
                color:#fff;
                border:none;
                cursor:pointer;
            }
            input[type=reset]
            {
                background:#dc3545;
                color:#fff;
                border:none;
                cursor:pointer;
            }
            h2{text-align:center;margin-bottom:20px;}
        </style>
    </head>
    <body>
        <form action="" method="post">
            {% csrf_token %}
            <h2>Manage Nutrition</h2>
            <table>
                <tr>
                    <td>Food Name</td>
                    <td><input type="text" name="txt_food"></td>
                </tr>
                <tr>
                    <td>Category</td>
                    <td><input type="text" name="txt_category"></td>
                </tr>
                <tr>
                    <td>Benefits</td>
                    <td><textarea name="txt_benefits"></textarea></td>
                </tr>
                <tr>
                    <td colspan="2" align="center">
                        <input type="submit" value="Edit">
                        <input type="reset" value="Delete">
                    </td>
                </tr>
            </table>
        </form>
    </body>
</html>
{% if msg %}
<script>
alert("{{msg}}");
window.location="{% url 'Administrator:ManageNutrition' %}";
</script>
{% endif %}
