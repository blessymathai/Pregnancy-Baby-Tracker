{% extends 'base.html' %}

{% block content %}

<div class="container py-4">

    <h2>Manage Medicines</h2>

    <div class="card shadow-sm p-4 mt-4">

        <form method="POST">

            {% csrf_token %}

            <input
                type="text"
                name="name"
                class="form-control mb-3"
                placeholder="Medicine name"
                required
            >

            <input
                type="text"
                name="dosage"
                class="form-control mb-3"
                placeholder="Dosage"
            >

            <textarea
                name="purpose"
                class="form-control mb-3"
                placeholder="Purpose"
            ></textarea>

            <textarea
                name="warning"
                class="form-control mb-3"
                placeholder="Warning"
            ></textarea>

            <button
                type="submit"
                class="btn btn-primary"
            >
                Add Medicine
            </button>

        </form>

    </div>


    <div class="card shadow-sm mt-4">

        <table class="table table-bordered">

            <thead>
                <tr>
                    <th>Name</th>
                    <th>Dosage</th>
                    <th>Purpose</th>
                    <th>Warning</th>
                </tr>
            </thead>

            <tbody>

                {% for medicine in medicines %}

                <tr>
                    <td>{{ medicine.name }}</td>
                    <td>{{ medicine.dosage }}</td>
                    <td>{{ medicine.purpose }}</td>
                    <td>{{ medicine.warning }}</td>
                </tr>

                {% empty %}

                <tr>
                    <td colspan="4" class="text-center">
                        No medicines found.
                    </td>
                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

{% endblock %}
