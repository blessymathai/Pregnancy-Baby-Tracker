<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Nutrition</title>
        <style>
            * {
                box-sizing: border-box;
                font-family: Arial, sans-serif;
            }
            body 
            {
                margin: 0;
                padding: 40px;
                background-color: #f5faff;
            }
            .container 
            {
                max-width: 1000px;
                margin: auto;
            }
            h2 
            {
                text-align: center;
                color: #000;
                margin-bottom: 30px;
            }
            .tables 
            {
                display: flex;
                gap: 25px;
            }
            .box
            {
                width: 50%;
                background-color: white;
                padding: 20px;
                border-radius: 12px;
                box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            }
            .box h3 
            {
                padding: 12px;
                margin-bottom: 15px;
                border-radius: 6px;
                text-align: center;
            }
            .recommended h3 
            {
                background-color: #9ddcf5;
            }
            .avoid h3 
            {
                background-color: #f3a6c2;
            }
            table 
            {
                width: 100%;
                border-collapse: collapse;
            }
            th,
            td 
            {
                border: 1px solid #ccc;
                padding: 12px;
                text-align: left;
            }
            th 
            {
                background-color: #000;
                color: white;
            }
            td input 
            {
                width: 100%;
                padding: 8px;
                border: 1px solid #b9e7f8;
                border-radius: 5px;
            }
            .btn 
            {
                margin-top: 15px;
                padding: 10px 18px;
                border: none;
                border-radius: 6px;
                background-color: #000;
                color: white;
                cursor: pointer;
            }
            .btn:hover 
            {
                background-color: #555;
            }
            @media (max-width: 700px) 
            {
                body 
                {
                    padding: 20px;
                }
                .tables 
                {
                    flex-direction: column;
                }
                .box 
                {
                    width: 100%;
                }

            }
        </style>
    </head>
    <body>
        <div class="container">
            <h2>🥗 Pregnancy Nutrition</h2>
            <div class="tables">
                <!-- Recommended Foods -->
                <div class="box recommended">
                    <h3>Recommended Foods</h3>
                    <table>
                        <tr>
                            <th>Food</th>
                            <th>Quantity</th>
                        </tr>
                        <tr>
                            <td>
                                <input type="text"
                                    placeholder="Enter food">
                            </td>
                            <td>
                                <input type="text"
                                    placeholder="Enter quantity">
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <input type="text"
                                    placeholder="Enter food">
                            </td>
                            <td>
                                <input type="text"
                                    placeholder="Enter quantity">
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <input type="text"
                                    placeholder="Enter food">
                            </td>
                            <td>
                                <input type="text"
                                    placeholder="Enter quantity">
                            </td>
                        </tr>
                    </table>
                    <button class="btn">
                        Add Food
                    </button>
                </div>
                <!-- Avoid Excess -->
                <div class="box avoid">

                    <h3>Avoid Excess</h3>
                    <table>
                        <tr>
                            <th>Food / Drink</th>
                            <th>Reason</th>
                        </tr>
                        <tr>
                            <td>
                                <input type="text"
                                    placeholder="Enter food">
                            </td>
                            <td>
                                <input type="text"
                                    placeholder="Enter reason">
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <input type="text"
                                    placeholder="Enter food">
                            </td>
                            <td>
                                <input type="text"
                                    placeholder="Enter reason">
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <input type="text"
                                    placeholder="Enter food">
                            </td>
                            <td>
                                <input type="text"
                                    placeholder="Enter reason">
                            </td>
                        </tr>
                    </table>
                    <button class="btn">
                        Add Item
                    </button>
                </div>
            </div>
        </div>
    </body>
</html>
