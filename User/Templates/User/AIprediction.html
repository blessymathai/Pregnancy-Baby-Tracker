<!DOCTYPE html>
<html>
<head>

<title>AI Prediction</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body {
background:#f4f8fb;
}

.ai-card {
max-width:800px;
margin:40px auto;
padding:30px;
background:white;
border:1px solid #000;
border-radius:12px;
}

</style>

</head>

<body>

<div class="ai-card">

<h2>
AI Pregnancy Health Prediction
</h2>

<p class="text-muted">
Enter health information for ML-based prediction.
</p>

<hr>

<form method="POST">

{% csrf_token %}

<div class="row">

<div class="col-md-6 mb-3">

<label>Age</label>

<input
type="number"
name="age"
class="form-control"
required>

</div>


<div class="col-md-6 mb-3">

<label>Systolic BP</label>

<input
type="number"
name="systolic"
class="form-control"
required>

</div>


<div class="col-md-6 mb-3">

<label>Diastolic BP</label>

<input
type="number"
name="diastolic"
class="form-control"
required>

</div>


<div class="col-md-6 mb-3">

<label>Blood Sugar</label>

<input
type="number"
step="0.01"
name="blood_sugar"
class="form-control"
required>

</div>


<div class="col-md-6 mb-3">

<label>Body Temperature</label>

<input
type="number"
step="0.01"
name="body_temperature"
class="form-control"
required>

</div>


<div class="col-md-6 mb-3">

<label>Heart Rate</label>

<input
type="number"
name="heart_rate"
class="form-control"
required>

</div>

</div>


<button
type="submit"
class="btn btn-primary">
Predict Health Risk
</button>

</form>


{% if result %}

<hr>

<div class="alert alert-info">

<h4>
AI Prediction Result
</h4>

<p>
<strong>
{{ result.risk }}
</strong>
</p>

<p>
{{ result.message }}
</p>

</div>

{% endif %}

</div>

</body>
</html>
