<!DOCTYPE html>
<html>
<head>

<title>Change Password</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body {
    background:#f4f8fb;
}

.password-card {
    max-width:500px;
    margin:60px auto;
    background:white;
    border:1px solid #000;
    padding:30px;
    border-radius:12px;
}

</style>

</head>

<body>

<div class="password-card">

<h3>Change Password</h3>

<hr>

{% if messages %}

{% for message in messages %}

<div class="alert alert-{{ message.tags }}">
{{ message }}
</div>

{% endfor %}

{% endif %}

<form method="POST">

{% csrf_token %}

<label>Old Password</label>

<input
type="password"
name="old_password"
class="form-control mb-3"
required>


<label>New Password</label>

<input
type="password"
name="new_password"
class="form-control mb-3"
required>


<label>Confirm Password</label>

<input
type="password"
name="confirm_password"
class="form-control mb-3"
required>


<button
type="submit"
class="btn btn-primary w-100">
Change Password
</button>

</form>

</div>

</body>
</html>
