<!DOCTYPE html>
<html>
<head>

    <title>Patients</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<div class="container mt-4">

    <h2>My Patients</h2>

    <hr>

    <table class="table table-bordered">

        <thead class="table-info">

            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Blood Group</th>
                <th>Action</th>
            </tr>

        </thead>

        <tbody>

        {% for patient in patients %}

            <tr>

                <td>
                    {{ patient.registration.user_name }}
                </td>

                <td>
                    {{ patient.registration.user_email }}
                </td>

                <td>
                    {{ patient.phone }}
                </td>

                <td>
                    {{ patient.blood_group }}
                </td>

                <td>

                    <a
                        href="{% url 'Doctor:Patients' %}"
                        class="btn btn-sm btn-primary"
                    >
                        View Patient
                    </a>

                    <a
                        href="{% url 'Doctor:ChatBox' %}?patient={{ patient.id }}"
                        class="btn btn-sm btn-dark"
                    >
                        Chat
                    </a>

                </td>

            </tr>

        {% empty %}

            <tr>
                <td colspan="5" class="text-center">
                    No patients found.
                </td>
            </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>
